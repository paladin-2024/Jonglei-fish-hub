services:
  - type: web
    name: jonglei-api
    plan: free
    runtime: docker
    rootDir: jonglei-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://jonglei-dashboard.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: jonglei-db
          property: connectionString
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: MOMO_ENVIRONMENT
        value: sandbox
      - key: MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_API_USER_ID
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: jonglei-db
    plan: free
    databaseName: jonglei_fish_hub
    user: jonglei_admin
